include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages: [test]

crm:test:
  stage: test
  image: ruby:3.4
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    RAILS_ENV: test
    POSTGRES_USER: kubo_root
    POSTGRES_PASSWORD: kubo_root_ci
    POSTGRES_DB: postgres
    TEST_DATABASE_URL: postgres://kubo_crm:kubo_crm_ci@postgres:5432/kubo_crm_test
  cache:
    key: crm-bundle
    paths: [vendor/bundle]
  before_script:
    - apt-get update -qq && apt-get install -y -qq build-essential libpq-dev postgresql-client >/dev/null
    - until PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d postgres -c 'select 1' >/dev/null 2>&1; do sleep 1; done
    - bundle config set --local path vendor/bundle
    - bundle install --jobs 4 --retry 3
    # El rol de la aplicacion no es superusuario: los superusuarios ignoran RLS
    # (incluso con FORCE) y la prueba de aislamiento dejaria de probar algo.
    - PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d postgres -c "CREATE ROLE kubo_crm LOGIN PASSWORD 'kubo_crm_ci' NOSUPERUSER NOCREATEDB NOCREATEROLE"
    - PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE kubo_crm_test OWNER kubo_crm ENCODING 'UTF8'"
    - bundle exec rails db:migrate
  script:
    - ruby test/field_cipher_test.rb
    - ruby test/integration/rls_and_cipher_test.rb
