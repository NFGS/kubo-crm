default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  url: <%= ENV["DATABASE_URL"] %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://kubo_crm:kubo_crm_dev@localhost:5433/kubo_crm") %>

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgres://kubo_crm:kubo_crm_dev@localhost:5433/kubo_crm_test") %>

production:
  <<: *default
